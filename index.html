<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bradisfer — Painel de Estoque</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep: #0b0b0d;
    --bg-page: #0b0b0d;
    --navy: #141414;
    --navy-light: #141414;
    --gold: #FFB800;
    --gold-bright: #FFC933;
    --gold-dark: #B88600;
    --glass: #131316;
    --glass-border: #26262c;
    --glass-hover: #1c1c21;
    --text: #D4D4D4;
    --text-muted: #8A8A8A;
    --text-faint: #808080;
    /* Status quartet re-derived to clear WCAG/CVD checks against this dark
       surface (validated with the dataviz skill's palette validator) — the
       previous neon set failed the lightness band, and amber collided with
       the brand gold used elsewhere for emphasis.
       BAIXO (amber) re-validated again on request to read as more urgent —
       moved from green (#199e70, felt "safe", not urgent) to a mustard/amber
       (#a87c0e) that reads as an alert without colliding with red RUPTURA;
       every warmer/brighter amber tested (closer to true orange) failed the
       CVD/normal-vision separation check against #e66767 — this shade was
       the closest to "vivid" that still cleared validation cleanly. */
    --red-a: #e66767; --red-b: #8a3838;
    --amber-a: #a87c0e; --amber-b: #6b4f09;
    --blue-a: #3987e5; --blue-b: #1c4d8f;
    --green-a: #008300; --green-b: #045c1f;
    --font-display: 'Inter', -apple-system, 'Segoe UI', sans-serif;
    --font-body: 'Inter', -apple-system, 'Segoe UI', sans-serif;
    --font-mono: 'IBM Plex Mono', 'Consolas', 'Courier New', monospace;

    /* ---- Camada de elevação/glass (aditiva — não substitui tokens acima) ---- */
    --glass-blur: 14px;
    --glass-bg: rgba(19, 19, 22, 0.72);
    --glass-bg-strong: rgba(15, 15, 17, 0.86);
    --glass-border-soft: rgba(255, 255, 255, 0.08);
    --glass-highlight: inset 0 1px 0 rgba(255, 255, 255, 0.045);
    --shadow-elevation-1: 0 1px 2px rgba(0,0,0,0.35), 0 1px 1px rgba(0,0,0,0.2);
    --shadow-elevation-2: 0 8px 24px -8px rgba(0,0,0,0.55), 0 2px 6px rgba(0,0,0,0.3);
    --shadow-elevation-3: 0 20px 48px -12px rgba(0,0,0,0.65), 0 4px 12px rgba(0,0,0,0.4);
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;

    /* ---- Tokens do modo claro da aba Vendas (extraídos de hex fixo) ---- */
    --vendas-indigo-deep: #1e1b4b;
    --vendas-indigo-mid: #312e81;
    --vendas-indigo-border: #3730a3;
    --vendas-indigo-accent: #4338ca;
    --vendas-indigo-text: #a5b4fc;
    --vendas-indigo-text-soft: #c7d2fe;
    --vendas-indigo-label: #818cf8;
    --vendas-danger: #f43f5e;
    --vendas-danger-text: #fda4af;
    --vendas-danger-text-strong: #fecdd3;
    --vendas-surface: #ffffff;
    --vendas-surface-border: #e5e7eb;
    --vendas-text: #1f2937;
    --vendas-text-muted: #9ca3af;
    --vendas-real-badge: #059669;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; font-family: var(--font-body); color: var(--text);
    background:
      radial-gradient(1100px 620px at 12% -8%, rgba(255,184,0,0.055), transparent 60%),
      radial-gradient(900px 560px at 100% 0%, rgba(57,135,229,0.05), transparent 55%),
      var(--bg-page);
    background-attachment: fixed;
    min-height: 100vh;
  }
  ::selection { background: var(--gold); color: var(--bg-deep); }

  .topbar {
    background: var(--glass-bg-strong);
    backdrop-filter: blur(var(--glass-blur)); -webkit-backdrop-filter: blur(var(--glass-blur));
    border-bottom: 1px solid var(--glass-border-soft);
    box-shadow: 0 1px 0 rgba(255,184,0,0.35), 0 12px 24px -16px rgba(0,0,0,0.6);
    color: white; padding: 14px 28px 12px;
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
    position: sticky; top: 0; z-index: 20;
  }
  .brand { display: flex; align-items: center; gap: 13px; }
  .brand-mark {
    width: 40px; height: 40px;
    display: flex; align-items: center; justify-content: center;
    filter: none;
  }
  .brand-mark img { width: 100%; height: 100%; object-fit: contain; }
  .brand-text h1 { margin: 0; font-family: var(--font-display); font-size: 19px; font-weight: 700; letter-spacing: 0.2px; }
  .brand-text p { margin: 2px 0 0; font-size: 12px; color: var(--text-muted); font-family: var(--font-mono); }
  .status { display: flex; align-items: center; gap: 18px; font-size: 13px; color: var(--text-muted); }
  .pulse-wrap { display: flex; align-items: center; gap: 7px; font-family: var(--font-mono); font-size: 12px; }
  .pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--green-a); animation: pulse 2s infinite; }
  @keyframes pulse {
    0% { opacity: 1; }
    50% { opacity: 0.4; }
    100% { opacity: 1; }
  }
  .refresh-btn {
    background: var(--glass); border: 1px solid var(--glass-border); border-radius: 8px; color: var(--text);
    padding: 7px 14px; font-size: 12px; font-family: var(--font-body); font-weight: 600;
    cursor: pointer; transition: background 0.15s, border-color 0.15s;
  }
  .refresh-btn:hover { background: var(--glass-hover); border-color: var(--gold); }
  .refresh-btn:active { opacity: 0.8; }
  .refresh-btn:disabled { opacity: 0.4; cursor: default; }


  .container { max-width: none; margin: 0; padding: 22px 32px 60px; position: relative; }

  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .kpi-card {
    background: var(--glass-bg); border: 1px solid var(--glass-border-soft); border-radius: var(--radius-md);
    backdrop-filter: blur(var(--glass-blur)); -webkit-backdrop-filter: blur(var(--glass-blur));
    padding: 16px 18px; box-shadow: var(--shadow-elevation-1), var(--glass-highlight);
    min-width: 0; overflow: hidden; transform-style: preserve-3d;
    transition: background 0.18s, border-color 0.18s, transform 0.25s cubic-bezier(0.22,1,0.36,1), box-shadow 0.25s;
  }
  @media (hover: hover) and (pointer: fine) {
    .kpi-card:hover {
      background: var(--glass-hover); border-color: #333339;
      transform: perspective(700px) rotateX(3deg) translateY(-4px) translateZ(6px);
      box-shadow: var(--shadow-elevation-2), var(--glass-highlight);
    }
  }
  .kpi-card.clickable { cursor: pointer; position: relative; }
  .kpi-card.clickable::after {
    content: ""; position: absolute; top: 12px; right: 12px; width: 6px; height: 6px; border-radius: 50%;
    background: var(--text-faint); opacity: 0.55;
  }
  .kpi-card.clickable:hover::after { background: var(--gold); opacity: 1; }
  .kpi-card.clickable.active { border-color: var(--gold); background: var(--glass-hover); box-shadow: 0 0 0 1px var(--gold), var(--shadow-elevation-2); }
  .kpi-card.clickable.active::after { background: var(--gold); opacity: 1; }
  .kpi-card .label { font-size: 10px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; line-height: 1.3; }
  .kpi-card .value {
    font-family: var(--font-mono); font-size: 19px; font-weight: 600; color: var(--text); line-height: 1.15;
    white-space: nowrap; cursor: default;
  }

  .kpi-card.hero { background: var(--glass-bg); border-left: 2px solid var(--gold); box-shadow: var(--shadow-elevation-1), var(--glass-highlight); }
  .kpi-card.hero .label { color: var(--text-muted); }
  .kpi-card.hero .value { color: var(--gold); font-size: 25px; font-weight: 700; letter-spacing: -0.2px; }

  .kpi-card.accent-red .value { color: var(--red-a); }
  .kpi-card.accent-amber .value { color: var(--amber-a); }
  .kpi-card.accent-blue .value { color: var(--blue-a); }
  .kpi-card.accent-gold {
    background: linear-gradient(155deg, var(--gold-bright), var(--gold)); border-color: var(--gold);
    box-shadow: var(--shadow-elevation-1), 0 0 0 1px rgba(255,184,0,0.25);
  }
  .kpi-card.accent-gold .label { color: rgba(0,0,0,0.65); }
  .kpi-card.accent-gold .value { color: #000; font-size: 25px; font-weight: 700; letter-spacing: -0.2px; }

  .panels { display: grid; grid-template-columns: 1.3fr 1fr; gap: 12px; margin-bottom: 16px; }
  @media (max-width: 860px) { .panels { grid-template-columns: 1fr; } }
  .panel {
    background: var(--glass-bg); border: 1px solid var(--glass-border-soft); border-radius: var(--radius-md); padding: 18px 20px;
    backdrop-filter: blur(var(--glass-blur)); -webkit-backdrop-filter: blur(var(--glass-blur));
    box-shadow: var(--shadow-elevation-1), var(--glass-highlight);
  }
  .panel h2 { font-family: var(--font-display); font-size: 12px; font-weight: 600; color: var(--gold); margin: 0 0 4px; letter-spacing: 0.8px; text-transform: uppercase; display: flex; align-items: center; gap: 7px; }
  .panel h2 .icon { width: 15px; height: 15px; opacity: 0.9; }
  .panel .hint { font-size: 11px; color: var(--text-faint); margin: 0 0 14px; }

  .chart-box { position: relative; width: 100%; }
  .chart-box-vendas { height: 280px; }

  /* ---- Ranking de marcas — lista de barras de progresso (HTML/CSS, não Chart.js) ---- */
  .marca-ranking { display: flex; flex-direction: column; gap: 3px; }
  .marca-rank-row {
    display: block; width: 100%; text-align: left; background: none; border: none; cursor: pointer;
    padding: 7px 8px; border-radius: var(--radius-sm); transition: background 0.15s;
  }
  .marca-rank-row:hover { background: var(--glass-hover); }
  .marca-rank-top {
    display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
    margin-bottom: 5px; font-size: 12.5px;
  }
  .marca-rank-nome { display: flex; align-items: baseline; gap: 7px; min-width: 0; }
  .marca-rank-pos {
    font-family: var(--font-mono); font-size: 10px; font-weight: 700; color: var(--text-faint);
    flex-shrink: 0; width: 16px;
  }
  .marca-rank-label { font-weight: 600; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .marca-rank-nums { display: flex; align-items: baseline; gap: 8px; flex-shrink: 0; font-family: var(--font-mono); }
  .marca-rank-valor { font-weight: 600; color: var(--text); }
  .marca-rank-pct { font-size: 10.5px; color: var(--text-faint); min-width: 30px; text-align: right; }
  .marca-rank-track { height: 7px; border-radius: 999px; background: var(--glass-border); overflow: hidden; }
  .marca-rank-fill {
    height: 100%; width: 100%; border-radius: 999px;
    transition: background 0.15s;
  }
  /* Entrada em cascata: cada barra cresce com um atraso maior que a
     anterior — só dispara quando .marca-ranking tem essa classe extra
     (adicionada via JS só em cliques reais, nunca em render passivo).
     Todas crescem até o mesmo 100% (as barras são uniformes agora, não
     proporcionais ao valor — só o texto ao lado mostra R$/%). */
  .marca-ranking.anima-entrada .marca-rank-fill { animation: marcaBarraCresce 0.7s cubic-bezier(0.22,1,0.36,1) backwards; }
  .marca-ranking.anima-entrada .marca-rank-row:nth-child(1) .marca-rank-fill { animation-delay: 0ms; }
  .marca-ranking.anima-entrada .marca-rank-row:nth-child(2) .marca-rank-fill { animation-delay: 60ms; }
  .marca-ranking.anima-entrada .marca-rank-row:nth-child(3) .marca-rank-fill { animation-delay: 120ms; }
  .marca-ranking.anima-entrada .marca-rank-row:nth-child(4) .marca-rank-fill { animation-delay: 180ms; }
  .marca-ranking.anima-entrada .marca-rank-row:nth-child(5) .marca-rank-fill { animation-delay: 240ms; }
  .marca-ranking.anima-entrada .marca-rank-row:nth-child(6) .marca-rank-fill { animation-delay: 300ms; }
  .marca-ranking.anima-entrada .marca-rank-row:nth-child(7) .marca-rank-fill { animation-delay: 360ms; }
  .marca-ranking.anima-entrada .marca-rank-row:nth-child(8) .marca-rank-fill { animation-delay: 420ms; }
  .marca-ranking.anima-entrada .marca-rank-row:nth-child(9) .marca-rank-fill { animation-delay: 480ms; }
  .marca-ranking.anima-entrada .marca-rank-row:nth-child(10) .marca-rank-fill { animation-delay: 540ms; }
  @keyframes marcaBarraCresce { from { width: 0 !important; } }
  @media (prefers-reduced-motion: reduce) {
    .marca-ranking.anima-entrada .marca-rank-fill { animation: none; }
  }

  /* ---- Modal "detalhe de marca" (mesmo padrão do modal de produto) ----
     Estático no HTML, fora de .scene-3d/#app — evita de vez o problema de
     will-change:transform quebrar position:fixed que tentativas anteriores
     (mover o card via appendChild) enfrentaram. Visual idêntico ao
     #modal-backdrop/#modal-panel já usado pro detalhe de produto. */
  .modal-marca-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.75);
    /* align-items não é mais "center" fixo — a altura vertical é ajustada
       via JS (--marca-modal-top, ver abrirDetalheMarca) pra abrir na mesma
       altura de onde o usuário clicou, não sempre no centro absoluto da
       tela (que em monitores grandes fica longe do ponto de clique).
       align-items:flex-start + padding-top dinâmico faz esse trabalho;
       horizontal continua centralizado (justify-content). */
    display: flex; align-items: flex-start; justify-content: center;
    padding-top: var(--marca-modal-top, 20vh);
    z-index: 50; padding-left: 20px; padding-right: 20px; padding-bottom: 20px;
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s;
  }
  .modal-marca-backdrop.open { opacity: 1; pointer-events: all; }
  /* Os dois modais (detalhe da marca + itens mais vendidos) ficam lado a
     lado dentro desse wrapper em telas largas — em telas estreitas
     (≤860px) viram uma coluna empilhada, já que lado a lado não cabe com
     conforto numa tela de celular. */
  .modal-marca-grupo { display: flex; gap: 16px; align-items: flex-start; max-width: 100%; }
  @media (max-width: 860px) {
    .modal-marca-grupo { flex-direction: column; max-height: 88vh; overflow-y: auto; }
  }
  .modal-marca-panel {
    background: var(--glass); border: 1px solid var(--gold); border-radius: 14px;
    max-width: 520px; width: 100%; max-height: 88vh; overflow-y: auto;
    padding: 32px 30px;
    box-shadow: 0 16px 48px rgba(0,0,0,0.5);
    transform: translateY(12px) scale(0.96); transition: transform 0.3s cubic-bezier(0.22,1,0.36,1);
  }
  .modal-marca-backdrop.open .modal-marca-panel { transform: translateY(0) scale(1); }
  /* O painel de itens só existe/mostra conteúdo quando abrirRankingItensMarca
     roda — .vazio esconde sem deixar um espaço vazio reservado no layout. */
  .modal-itens-panel:empty { display: none; }
  /* Nasce "de dentro" do painel de detalhe (à esquerda dele): começa
     achatado horizontalmente e deslocado pra dentro da posição do 1º
     modal (transform-origin na borda esquerda faz o scaleX crescer a
     partir dali, não do centro), e se expande até o tamanho/posição
     final — dá a sensação de emergir de dentro do primeiro painel, não
     só aparecer do lado já pronto. Dispara só quando .modal-itens-panel
     não está vazio (tem conteúdo montado por abrirRankingItensMarca). */
  .modal-itens-panel:not(:empty) {
    transform-origin: 0% 50%;
    /* Mesma duração/curva da barra que tomba no 1º modal (ver
       marcaBarraTombaModal) — os dois efeitos terminam juntos. */
    animation: itensPainelEmerge 0.8s cubic-bezier(0.65,0,0.35,1) forwards;
  }
  @keyframes itensPainelEmerge {
    0%   { transform: scaleX(0.15) translateX(-40px); opacity: 0; }
    100% { transform: scaleX(1) translateX(0); opacity: 1; }
  }
  @media (max-width: 860px) {
    .modal-marca-panel { max-width: 100%; max-height: none; overflow-y: visible; }
    /* Empilhado (mobile), "de dentro" vira "de cima" — nasce achatado
       verticalmente saindo de baixo do 1º painel, mantendo a mesma ideia
       de emergir dele, só que na direção que faz sentido pro layout em
       coluna. */
    .modal-itens-panel:not(:empty) {
      transform-origin: 50% 0%;
      animation-name: itensPainelEmergeVertical;
    }
    @keyframes itensPainelEmergeVertical {
      0%   { transform: scaleY(0.15) translateY(-30px); opacity: 0; }
      100% { transform: scaleY(1) translateY(0); opacity: 1; }
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .modal-marca-backdrop, .modal-marca-panel { transition: none; }
    .modal-itens-panel:not(:empty) { animation: none; }
  }
  /* ---- Conteúdo do modal de detalhe da marca ---- */
  .modal-marca-topo { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; margin-bottom: 20px; }
  .modal-marca-nome { font-family: var(--font-display); font-size: 18px; font-weight: 700; color: var(--text); }
  /* height precisa ser >= ao comprimento da barra (220px) + folga, porque
     no giro máximo (90°, em pé) esse comprimento vira a altura visual da
     barra — sem essa folga ela vaza pra cima/baixo, sobrepondo o nome da
     marca e o valor em R$ (era esse o bug visto: barra grande demais
     cobrindo o resto do conteúdo do modal). */
  .modal-marca-barra-track {
    width: 100%; height: 240px;
    display: flex; align-items: center; justify-content: center;
  }
  .modal-marca-barra-fill {
    /* Comprimento fixo, não mais proporcional ao valor da marca — o modal
       é estreito demais (~460px) pra uma barra width:X% caber com folga
       quando girada 90° (a largura vira a altura visual nesse ângulo).
       Uma marca líder perto de 100% faria a barra quase do tamanho do
       modal inteiro, sobrepondo nome/valor ao girar — era esse o bug
       visto (o width:X% inline tinha prioridade sobre qualquer regra de
       classe, então nenhum teto no CSS surtia efeito antes desta troca
       pra um valor fixo direto no HTML). A proporção real da marca
       continua visível no texto (R$ e %) logo abaixo da barra. */
    width: 220px; height: 30px; border-radius: 999px;
    transform-origin: 50% 50%;
    box-shadow: 0 6px 20px -6px rgba(0,0,0,0.6);
    /* Nasce deitada (0°) e tomba fisicamente até em pé (90°) — rotação
       real via @keyframes, com ângulos intermediários visíveis, não uma
       interpolação abstrata de forma. Dispara assim que o modal abre. */
    animation: marcaBarraTombaModal 0.8s cubic-bezier(0.65,0,0.35,1) forwards;
  }
  @keyframes marcaBarraTombaModal {
    0%   { transform: rotate(0deg); }
    100% { transform: rotate(90deg); }
  }
  .modal-marca-valor { font-family: var(--font-mono); font-size: 28px; font-weight: 700; color: var(--gold); letter-spacing: -0.3px; text-align: center; margin-top: 18px; }
  .modal-marca-pct { font-size: 12px; color: var(--text-faint); text-align: center; margin: 3px 0 18px; }
  .modal-marca-stats { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .modal-marca-stat {
    background: var(--glass-bg); border: 1px solid var(--glass-border-soft); border-radius: var(--radius-sm);
    padding: 8px 14px; min-width: 74px; border-top: 2px solid var(--stat-cor, var(--glass-border));
  }
  .modal-marca-stat .k { display: block; font-size: 9.5px; font-weight: 600; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 3px; }
  .modal-marca-stat .v { font-family: var(--font-mono); font-size: 15px; font-weight: 700; color: var(--text); }
  @media (prefers-reduced-motion: reduce) {
    .modal-marca-barra-fill { animation: none; transform: rotate(90deg); }
  }

  .marca-medalha {
    display: flex; align-items: center; gap: 6px; font-family: var(--font-mono);
    font-weight: 700; font-size: 13px; padding: 6px 12px; border-radius: 999px;
    background: linear-gradient(135deg, var(--medalha-a), var(--medalha-b));
    color: #1a1a1a; box-shadow: 0 4px 14px -4px rgba(0,0,0,0.5);
  }
  .marca-medalha .icon { width: 15px; height: 15px; }
  .marca-medalha-simples {
    background: var(--glass); color: var(--text-muted); border: 1px solid var(--glass-border);
    box-shadow: none;
  }

  /* ---- Modal "itens mais vendidos da marca" — gráfico de barras horizontal ----
     Mesmo padrão visual do ranking de marcas (barras uniformes de fundo,
     preenchimento colorido crescendo em cascata), mas aqui a barra É
     proporcional (não uniforme) — a métrica é Média Mensal vendida de cada
     produto, e a comparação de tamanho entre os 10 itens é o ponto central
     do gráfico. */
  .modal-itens-titulo { font-family: var(--font-display); font-size: 15px; font-weight: 700; color: var(--gold); margin-bottom: 4px; }
  .modal-itens-sub { font-size: 11px; color: var(--text-faint); margin-bottom: 18px; }
  .modal-itens-lista { display: flex; flex-direction: column; gap: 10px; }
  .modal-itens-row { display: block; }
  .modal-itens-top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 5px; font-size: 12px; }
  .modal-itens-nome { display: flex; align-items: baseline; gap: 7px; min-width: 0; }
  .modal-itens-pos { font-family: var(--font-mono); font-size: 10px; font-weight: 700; color: var(--text-faint); flex-shrink: 0; width: 16px; }
  .modal-itens-label { font-weight: 600; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .modal-itens-valor { font-family: var(--font-mono); font-weight: 600; color: var(--text); flex-shrink: 0; }
  .modal-itens-track { height: 8px; border-radius: 999px; background: var(--glass-border); overflow: hidden; }
  .modal-itens-fill {
    height: 100%; border-radius: 999px;
    /* --pct-barra vem inline (proporção real de cada produto) — usada
       explicitamente nos dois extremos da keyframe abaixo. Antes o
       tamanho final vinha via width:X% inline direto no elemento, que
       sempre vence sobre qualquer width do CSS (inline tem prioridade
       sobre classe, independente de especificidade): a barra nascia já
       no tamanho final, sem crescer visivelmente — era esse o bug de
       "sem animação" visto (mesmo problema já corrigido antes no modal
       de detalhe da marca, reapareceu aqui porque é um HTML separado). */
    width: var(--pct-barra, 0%);
    /* Cascata de 60ms entre barras (mesmo valor já usado no ranking de
       marcas — ver .marca-ranking.anima-entrada), 0.5s por barra. "both"
       aplica o frame 0% (width:0) durante o delay inicial também, não só
       depois — sem isso a barra ficaria no width base (o valor final)
       visível enquanto espera a vez de animar. */
    animation: itensBarraCresce 0.5s cubic-bezier(0.22,1,0.36,1) both;
  }
  @keyframes itensBarraCresce {
    0%   { width: 0; }
    100% { width: var(--pct-barra, 0%); }
  }
  /* +800ms em cada delay — só começam a crescer depois que o popup
     inteiro termina de "emergir" de dentro do 1º modal (mesma duração de
     itensPainelEmerge), não simultâneo a esse movimento. Cascata de 60ms
     entre barras, mesmo valor do ranking de marcas. */
  .modal-itens-row:nth-child(1) .modal-itens-fill { animation-delay: 800ms; }
  .modal-itens-row:nth-child(2) .modal-itens-fill { animation-delay: 860ms; }
  .modal-itens-row:nth-child(3) .modal-itens-fill { animation-delay: 920ms; }
  .modal-itens-row:nth-child(4) .modal-itens-fill { animation-delay: 980ms; }
  .modal-itens-row:nth-child(5) .modal-itens-fill { animation-delay: 1040ms; }
  .modal-itens-row:nth-child(6) .modal-itens-fill { animation-delay: 1100ms; }
  .modal-itens-row:nth-child(7) .modal-itens-fill { animation-delay: 1160ms; }
  .modal-itens-row:nth-child(8) .modal-itens-fill { animation-delay: 1220ms; }
  .modal-itens-row:nth-child(9) .modal-itens-fill { animation-delay: 1280ms; }
  .modal-itens-row:nth-child(10) .modal-itens-fill { animation-delay: 1340ms; }
  @media (prefers-reduced-motion: reduce) {

  }

  /* ---- Cartões da Rotina de Compras entrando com fade + deslize, ao trocar de dia ----
     Duração individual bem mais longa que o normal de propósito: com poucos
     cartões (ex.: terça/sexta) não existe cascata pra dar a sensação de

  .rotina-grid-animada .rotina-card { animation: cartaoEntrada 0.9s cubic-bezier(0.22,1,0.36,1) backwards; }

  .rotina-grid-animada .rotina-card:nth-child(n+11) { animation-delay: 700ms; }
  .rotina-grid-animada .rotina-card:nth-child(n+12) { animation-delay: 770ms; }
  .rotina-grid-animada .rotina-card:nth-child(n+13) { animation-delay: 840ms; }
  .rotina-grid-animada .rotina-card:nth-child(n+14) { animation-delay: 910ms; }
  .rotina-grid-animada .rotina-card:nth-child(n+15) { animation-delay: 980ms; }
  .rotina-grid-animada .rotina-card:nth-child(n+16) { animation-delay: 1050ms; }
  .rotina-grid-animada .rotina-card:nth-child(n+17) { animation-delay: 1120ms; }

  .donut-wrap { display: flex; flex-direction: column; align-items: center; padding: 16px 0 6px; position: relative; }

  /* Auréola atrás do anel — puramente decorativa (fica atrás via z-index/
     position), cor reage à fatia em destaque via JS (--glow-cor). Sutil de
     propósito: reforça profundidade sem competir com o gráfico. Menor que
     o wrapper (o anel real fica no centro dos 340px, com margem lateral
     bem maior reservada pro layout.padding, onde a seta de hover sai
     lateralmente com mais respiro até o rótulo). */
  .donut-glow {
    position: absolute; top: 16px; left: 50%; width: 208px; height: 208px;
    transform: translate(-50%, 0) translateY(66px); border-radius: 50%;
    background: radial-gradient(circle, var(--glow-cor, var(--gold)) 0%, transparent 68%);
    opacity: 0.16; filter: blur(22px); pointer-events: none;

  }
  .modal-backdrop.open { opacity: 1; pointer-events: all; }
  .modal-panel {
    background: var(--glass);
    border: 1px solid var(--gold); border-radius: 14px;
    max-width: 560px; width: 100%; max-height: 85vh; overflow-y: auto;
    padding: 24px 26px;
    box-shadow: 0 16px 48px rgba(0,0,0,0.5);
    transform: translateY(12px); transition: transform 0.22s cubic-bezier(0.22,1,0.36,1);
  }
  .modal-backdrop.open .modal-panel { transform: translateY(0); }
  .modal-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 6px; }
  .modal-title { font-family: var(--font-display); font-size: 16px; font-weight: 700; color: white; line-height: 1.35; }
  .modal-sub { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
  .modal-close {
    background: var(--glass); border: 1px solid var(--glass-border); border-radius: 8px; color: var(--text-muted);
    width: 28px; height: 28px; cursor: pointer; flex-shrink: 0;
    font-size: 16px; line-height: 1; display: flex; align-items: center; justify-content: center;
  }
  .modal-close:hover { background: var(--glass-hover); color: white; }

  .mock-warning {
    background: rgba(255,184,0,0.08); border: 1px solid var(--gold); border-radius: 8px; color: var(--gold);
    padding: 10px 14px; font-size: 12px; margin: 16px 0; line-height: 1.5;
  }

  /* ---- Menu de navegação lateral: efeito 3D "porta abrindo" ---- */
  body { perspective: 1600px; }
  .scene-3d {
    transform-style: preserve-3d; transform-origin: 50% 50%;
    transition: transform 0.55s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.5s ease;
    will-change: transform;
  }
  .scene-3d.nav-open {
    transform: translateX(190px) translateZ(-160px) rotateY(-9deg) scale(0.94);
    filter: brightness(0.55) saturate(0.85);
  }
  .nav-toggle {
    width: 36px; height: 36px; border-radius: var(--radius-sm);
    background: var(--glass); border: 1px solid var(--glass-border); color: var(--text);
    cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    transition: background 0.15s, border-color 0.15s;
  }
  .nav-toggle:hover { background: var(--glass-hover); border-color: var(--gold); }
  .nav-toggle::before, .nav-toggle::after, .nav-toggle span {
    content: ""; display: block; width: 16px; height: 2px; background: currentColor; border-radius: 2px;
  }
  .nav-toggle span { position: relative; }
  .nav-toggle::before { position: absolute; transform: translateY(-6px); }
  .nav-toggle::after { position: absolute; transform: translateY(6px); }

  .nav-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.55);
    z-index: 55; opacity: 0; pointer-events: none; transition: opacity 0.2s;
  }
  .nav-backdrop.open { opacity: 1; pointer-events: all; }

  .nav-sidebar {
    position: fixed; top: 0; left: 0; bottom: 0; width: 300px; max-width: 84vw;
    background: var(--glass-bg-strong);
    backdrop-filter: blur(var(--glass-blur)); -webkit-backdrop-filter: blur(var(--glass-blur));
    border-right: 1px solid var(--glass-border-soft);
    box-shadow: var(--shadow-elevation-3), 24px 0 60px -20px rgba(0,0,0,0.7);
    z-index: 56; display: flex; flex-direction: column;
    transform-style: preserve-3d; transform-origin: 0% 50%;
    transform: perspective(1600px) rotateY(-100deg) translateX(-40px);
    opacity: 0;
    transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.35s ease;
    will-change: transform;
  }
  .nav-sidebar.open {
    transform: perspective(1600px) rotateY(0deg) translateX(0);
    opacity: 1;
  }
  .nav-sidebar-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 16px 14px; border-bottom: 1px solid var(--glass-border-soft);
  }
  .nav-sidebar-title { font-family: var(--font-display); font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.7px; }
  .nav-close {
    width: 30px; height: 30px; border-radius: var(--radius-sm);
    background: var(--glass); border: 1px solid var(--glass-border); color: var(--text-muted);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .nav-close:hover { background: var(--glass-hover); color: white; }
  .nav-close .icon { width: 14px; height: 14px; }
  .nav-sidebar-body { padding: 14px; display: flex; flex-direction: column; gap: 6px; }
  .nav-item {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
    padding: 12px 14px; border-radius: var(--radius-sm); border: 1px solid transparent;
    background: transparent; color: var(--text-muted); font-size: 14px; font-weight: 600;
    cursor: pointer; transition: background 0.15s, border-color 0.15s, color 0.15s;
  }
  .nav-item:hover { background: var(--glass-hover); color: var(--text); }
  .nav-item.active { background: rgba(255,184,0,0.1); border-color: var(--gold); color: var(--gold); }
  .nav-item .icon { width: 18px; height: 18px; flex-shrink: 0; }

  .modal-section { margin-top: 20px; }
  .modal-section-title { font-size: 11px; font-weight: 600; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }
  .modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .modal-stat { background: var(--glass); border: 1px solid var(--glass-border); border-radius: 10px; padding: 12px 14px; }
  .modal-stat .k { font-size: 11px; color: var(--text-muted); margin-bottom: 5px; }
  .modal-stat .v { font-family: var(--font-mono); font-size: 16px; font-weight: 600; color: var(--text); }

  .suggestion-box {
    background: var(--gold); border-radius: 10px;
    padding: 16px 18px; margin-top: 18px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .suggestion-box .k { font-size: 12px; color: rgba(0,0,0,0.7); font-weight: 600; }
  .suggestion-box .v { font-family: var(--font-mono); font-size: 24px; font-weight: 700; color: #000; }

  .rotina-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px; }
  .rotina-card {
    background: var(--glass-bg); border: 1px solid var(--glass-border-soft); border-radius: var(--radius-sm);
    box-shadow: var(--shadow-elevation-1);
    padding: 12px 14px; transition: background 0.15s, border-color 0.15s, transform 0.15s, box-shadow 0.15s;
  }
  .rotina-card.clickable { cursor: pointer; }
  @media (hover: hover) and (pointer: fine) {
    .rotina-card.clickable:hover { background: var(--glass-hover); border-color: var(--gold); transform: translateY(-1px); box-shadow: var(--shadow-elevation-2); }
  }
  .rotina-card .rc-nome { font-size: 13px; font-weight: 600; color: var(--text); line-height: 1.3; margin-bottom: 8px; min-height: 34px; }
  .rotina-card .rc-rodape { display: flex; align-items: center; justify-content: space-between; gap: 6px; flex-wrap: wrap; }
  .rotina-tipo { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; color: var(--text-faint); }
  .rotina-status-nao-encontrado { font-size: 11px; color: var(--text-faint); font-style: italic; }

  .modal-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 4px; }
  .modal-table thead th {
    text-align: left; padding: 7px 10px; color: var(--text-faint); font-weight: 600;
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.3px; border-bottom: 1px solid var(--glass-border); cursor: default;
  }
  .modal-table tbody td { padding: 9px 10px; border-bottom: 1px solid var(--glass-border); color: var(--text); font-family: var(--font-body); font-size: 12.5px; }
  .modal-table tbody tr:last-child td { border-bottom: none; }
  .modal-table .num { text-align: right; }
  .badge { padding: 2px 9px; border-radius: 999px; font-size: 10px; font-weight: 700; display: inline-block; text-transform: uppercase; letter-spacing: 0.3px; }
  .badge::before { content: "● "; }
  .badge-ruptura { background: rgba(230,103,103,0.14); color: var(--red-a); }
  .badge-baixo { background: rgba(25,158,112,0.14); color: var(--amber-a); }
  .badge-excesso { background: rgba(57,135,229,0.14); color: var(--blue-a); }
  .badge-ok { background: rgba(0,131,0,0.14); color: var(--green-a); }
  .num { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

  .loading, .error-box { text-align: center; padding: 70px 20px; color: var(--text-muted); }
  .error-box { color: var(--red-a); max-width: 480px; margin: 0 auto; line-height: 1.6; }
  .spinner {
    width: 30px; height: 30px; border: 3px solid var(--glass-border); border-top-color: var(--gold);
    border-radius: 50%; margin: 0 auto 14px; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  footer { text-align: center; padding: 22px; color: var(--text-faint); font-size: 12px; font-family: var(--font-body); }

  /* ==================== AJUSTES PARA CELULAR/TABLET ==================== */
  @media (max-width: 700px) {
    .topbar { padding: 14px 16px 12px; gap: 8px; }
    .brand-mark { width: 32px; height: 32px; }
    .brand-text h1 { font-size: 15px; }
    .brand-text p { font-size: 10px; }
    .status { gap: 10px; font-size: 11px; flex-wrap: wrap; }
    .refresh-btn { padding: 7px 12px; font-size: 12px; }

    .container { padding: 16px 12px 40px; }

    .kpi-grid { grid-template-columns: repeat(2, 1fr); gap: 1px; margin-bottom: 18px; }
    .kpi-card { padding: 12px 14px; }
    .kpi-card .label { font-size: 10px; margin-bottom: 6px; }
    .kpi-card .value { font-size: 18px; }

    .panel { padding: 16px; }
    .panel h2 { font-size: 12px; }

    /* Blur pesado em muitos cards empilhados custa scroll performance em
       celular — reduz a intensidade em vez de empilhar vários blurs full-size
       durante o scroll longo da página. */
    :root { --glass-blur: 7px; }

    .filters { gap: 8px; }
    .filters > .autocomplete-wrap,
    input[type=search], input[type=text] { width: 100%; }
    .clear-link { margin-left: 0; }

    /* Tabelas viram roláveis na horizontal em vez de espremer ou vazar da tela */
    table { display: block; overflow-x: auto; -webkit-overflow-scrolling: touch; white-space: nowrap; }
    thead th, tbody td { padding: 9px 10px; }
    .modal-table { display: block; overflow-x: auto; -webkit-overflow-scrolling: touch; white-space: nowrap; }

    /* "Marcas que precisam de compra" — vira cartão em vez de rolar pro
       lado, pra dar pra ver tudo de uma vez sem gesto nenhum. */
    .marcas-criticas-table { display: block; overflow-x: visible; white-space: normal; width: 100%; }
    .marcas-criticas-table thead { display: none; }
    .marcas-criticas-table tbody { display: block; }
    .marcas-criticas-table tbody tr {
      display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px;
      padding: 12px 14px; border-bottom: 1px solid var(--glass-border);
    }
    .marcas-criticas-table tbody tr td:first-child { grid-column: 1 / -1; }
    .marcas-criticas-table tbody td {
      display: flex; flex-direction: column; align-items: flex-start;
      border: none; padding: 0; font-size: 13px; white-space: normal;
    }
    .marcas-criticas-table tbody td.num { align-items: flex-start; text-align: left; }
    .marcas-criticas-table tbody td::before {
      content: attr(data-label); color: var(--text-faint); font-size: 9px;
      text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 3px; font-weight: 600;
    }
    .marcas-criticas-table tbody td:first-child { font-size: 14px; font-weight: 600; }
    .marcas-criticas-table tbody td:first-child::before { content: none; }

    .modal-backdrop { padding: 0; align-items: flex-end; }
    .modal-panel {
      max-width: 100%; width: 100%; max-height: 92vh;
      padding: 20px 16px 24px;
    }
    .modal-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
    .modal-title { font-size: 16px; }

    .rotina-grid { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
    .rotina-card { padding: 10px 12px; }

    .donut-ring-wrap { width: 180px; height: 180px; }
    .donut-center .n { font-size: 26px; }
    .donut-glow { display: none; }

    .suggestion-box { flex-direction: column; align-items: flex-start; gap: 6px; }
    .suggestion-box .v { font-size: 21px; }

    /* botões de ação em pilha, ocupando a largura toda — mais fácil de tocar */
    .panel > div[style*="display:flex"][style*="justify-content:space-between"] {
      flex-direction: column; align-items: stretch !important;
    }

    /* Em telas pequenas o efeito 3D (perspective + will-change + filter no
       conteúdo por trás) causava flash de repaint no Safari iOS. Solução:
       o conteúdo principal fica parado, e a sidebar anima só opacidade —
       a transição mais simples e barata que existe, sem transform, sem
       perspective, sem backdrop-filter. Isso é 100% estável em qualquer
       engine mobile, ao custo de perder o slide (ela só aparece/desaparece
       com um fade curto), o que é uma troca aceitável em tela pequena. */
    body { perspective: none; }
    .scene-3d { transform: none; filter: none; }
    .nav-sidebar {
      width: 260px; max-width: 78vw;
      background: #0f0f11; backdrop-filter: none; -webkit-backdrop-filter: none;
      left: 0; transform: none;
      opacity: 0; visibility: hidden;
      transition: opacity 0.22s ease-out, visibility 0s linear 0.22s;
    }
    .nav-sidebar.open { opacity: 1; visibility: visible; transition: opacity 0.22s ease-out; }
  }
  @media (max-width: 420px) {
    .kpi-grid { grid-template-columns: 1fr 1fr; }
    .modal-grid { grid-template-columns: 1fr; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
    body { perspective: none; }
    .scene-3d, .scene-3d.nav-open { transform: none !important; filter: none !important; }
    .nav-sidebar { transform: translateX(-100%) !important; }
    .nav-sidebar.open { transform: translateX(0) !important; }
  }
</style>

// Escapa texto vindo da planilha/API (produto, marca, fornecedor...) antes de
// jogar em innerHTML — sem isso, um nome de produto com "<" ou "&" quebra o
// layout, e alguém com acesso de edição na planilha poderia injetar HTML/JS.
const MAPA_ESCAPE_HTML = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
function escapeHtml(texto) {
  return String(texto == null ? '' : texto).replace(/[&<>"']/g, ch => MAPA_ESCAPE_HTML[ch]);
}

// Retrofita acessibilidade de teclado em elementos clicáveis que não são
// <button>/<a>/<input>/<select> nativos (chips, linhas de tabela, cards...):
// dá foco via Tab e ativa com Enter/Espaço, sem precisar reescrever cada
// template de HTML pra usar <button>.
function tornarClicaveisAcessiveis(raiz) {
  raiz.querySelectorAll('.clickable, .chip, .legend-item, .autocomplete-item, thead th[data-col]').forEach(el => {
    const tag = el.tagName;
    if (tag === 'BUTTON' || tag === 'A' || tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
    if (!el.hasAttribute('tabindex')) el.tabIndex = 0;
    // <th> mantém o role nativo de columnheader (o aria-sort abaixo já avisa
    // que é ordenável) — sobrescrever pra "button" faria o leitor de tela
    // perder a associação da coluna com as células da tabela.
    if (tag !== 'TH' && !el.hasAttribute('role')) el.setAttribute('role', 'button');
    if (!el.dataset.a11yClique) {
      el.dataset.a11yClique = '1';
      el.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); el.click(); }
      });
    }
  });
  raiz.querySelectorAll('thead th[data-col]').forEach(th => {
    const seta = th.querySelector('.arrow');
    const dir = seta ? seta.textContent.trim() : '';
    th.setAttribute('aria-sort', dir === '▲' ? 'ascending' : dir === '▼' ? 'descending' : 'none');
  });
}

// Gera e baixa um CSV (";" como separador e vírgula decimal, pra abrir certo
// no Excel BR sem precisar de "Texto em colunas") a partir de uma matriz de
// linhas. BOM no começo garante que acentos apareçam corretos no Excel.
function baixarCSV(nomeArquivo, cabecalhos, linhas) {
  const formatarCampo = valor => {
    const texto = String(valor == null ? '' : valor);
    return /[;"\n]/.test(texto) ? '"' + texto.replace(/"/g, '""') + '"' : texto;
  };
  const conteudo = [cabecalhos, ...linhas].map(l => l.map(formatarCampo).join(';')).join('\r\n');
  const blob = new Blob(['\uFEFF' + conteudo], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = nomeArquivo;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);
}

// Versão abreviada pros cards de KPI (evita estourar a largura do card
// com valores grandes, tipo R$ 4.334.163 -> R$ 4,33 mi)
function fmtMoedaCompacta(v) {
  const abs = Math.abs(v);
  if (abs >= 1000000) return 'R$ ' + (v / 1000000).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' mi';
  if (abs >= 1000) return 'R$ ' + (v / 1000).toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + ' mil';
  return fmtMoeda(v);
}

function parseNumeroBR(raw) {
  if (raw === undefined || raw === null) return 0;
  let s = String(raw).trim();
  if (s === '') return 0;
  s = s.replace(/[^0-9,.\-]/g, '');
  if (s === '' || s === '-') return 0;
  if (s.includes(',') && s.includes('.')) {
    s = s.replace(/\./g, '').replace(',', '.');
  } else if (s.includes(',')) {
    s = s.replace(',', '.');
  } else if (s.includes('.')) {
    const partes = s.split('.');
    if (partes.length > 1 && partes[partes.length - 1].length === 3) {
      s = s.replace(/\./g, '');
    }
  }
  const num = parseFloat(s);
  return isNaN(num) ? 0 : num;
}

function parseCSV(texto) {
  const linhas = [];
  let campo = '', linhaAtual = [], dentroAspas = false;
  for (let i = 0; i < texto.length; i++) {
    const c = texto[i], prox = texto[i + 1];
    if (dentroAspas) {
      if (c === '"' && prox === '"') { campo += '"'; i++; }
      else if (c === '"') { dentroAspas = false; }
      else { campo += c; }
    } else {
      if (c === '"') { dentroAspas = true; }
      else if (c === ',') { linhaAtual.push(campo); campo = ''; }
      else if (c === '\r') { /* ignora */ }
      else if (c === '\n') { linhaAtual.push(campo); campo = ''; linhas.push(linhaAtual); linhaAtual = []; }
      else { campo += c; }
    }
  }
  if (campo !== '' || linhaAtual.length > 0) { linhaAtual.push(campo); linhas.push(linhaAtual); }
  if (linhas.length === 0) return [];
  const cabecalho = linhas[0];
  return linhas.slice(1).filter(l => l.some(v => v !== '')).map(l => {
    const obj = {};
    cabecalho.forEach((h, idx) => { obj[h] = l[idx] !== undefined ? l[idx] : ''; });
    return obj;
  });
}

// id do elemento -> último valor numérico que ele terminou de mostrar.
// Chave por el.id (string), não por referência ao nó: renderizar() reescreve
// #app inteiro via innerHTML a cada chamada, então o <div id="kpi-total">
// de agora é sempre um objeto DOM novo — uma chave por referência nunca
// bateria entre renders, e a barra sempre recomeçaria do zero mesmo com
// esse Map. animarAgora segue a mesma convenção de animarDonutNoProximoRender:
// true só quando a renderização veio de uma seleção real do usuário.
const ultimoValorKpi = {};

function animarNumero(el, valorFinal, formatador, duracaoMs, animarAgora) {
  const chave = el.id;
  if (!animarAgora || document.hidden) {
    el.textContent = formatador(valorFinal);
    ajustarFonteParaCaber(el);
    if (chave) ultimoValorKpi[chave] = valorFinal;
    return;
  }

  const de = (chave && chave in ultimoValorKpi) ? ultimoValorKpi[chave] : 0;
  const inicio = performance.now();
  function passo(agora) {
    const t = Math.min(1, (agora - inicio) / duracaoMs);
    const ease = 1 - Math.pow(1 - t, 3);
    el.textContent = formatador(de + (valorFinal - de) * ease);
    ajustarFonteParaCaber(el);
    if (t < 1) {
      requestAnimationFrame(passo);
    } else if (chave) {
      ultimoValorKpi[chave] = valorFinal;
    }
  }
  requestAnimationFrame(passo);
}

// Garante que o valor NUNCA estoure a largura do card: reduz o
// tamanho da fonte em passos pequenos até caber, com um piso mínimo
// legível. Roda a cada frame da animação (é uma operação barata).
function ajustarFonteParaCaber(el) {
  const tamanhoMax = 27, tamanhoMin = 14;
  let tamanho = tamanhoMax;
  el.style.fontSize = tamanho + 'px';
  while (el.scrollWidth > el.clientWidth && tamanho > tamanhoMin) {
    tamanho -= 1;
    el.style.fontSize = tamanho + 'px';
  }
}

// Espera um pouquinho depois da última tecla digitada antes de redesenhar
// o painel inteiro — sem isso, cada letra redesenha tudo (KPIs, gráficos,
// tabelas), o que fica pesado principalmente no celular.
function debounce(fn, atrasoMs) {
  let temporizador = null;
  return function (...args) {
    clearTimeout(temporizador);
    temporizador = setTimeout(() => fn.apply(this, args), atrasoMs);
  };
}

function normalizarProduto(texto) {
  return String(texto || '').trim().toUpperCase().replace(/\s+/g, ' ');
}

async function carregarDados() {
  const btn = document.getElementById('refresh-btn');
  btn.disabled = true;
  btn.textContent = 'Atualizando...';
  document.getElementById('subtitle').textContent = 'conectando...';

  try {
    const [respBase, respAnalise] = await Promise.all([
      fetch(CSV_URL + '&t=' + Date.now()),
      fetch(ANALISE_CSV_URL + '&t=' + Date.now()).catch(() => null), // fonte opcional — não trava o painel se falhar
    ]);
    if (!respBase.ok) throw new Error('HTTP ' + respBase.status);
    const textoBase = await respBase.text();
    const parsedData = parseCSV(textoBase);
    const linhas = parsedData.filter(r => r['Código Barras'] && String(r['Código Barras']).trim() !== '');

    // ---- fonte 2 (opcional): Mínimo/Máximo calculados na planilha de análise ----
    const minMaxPlanilha = new Map();
    if (respAnalise && respAnalise.ok) {
      const textoAnalise = await respAnalise.text();
      const linhasAnalise = parseCSV(textoAnalise);
      linhasAnalise.forEach(r => {
        const chave = normalizarProduto(r['Produto']);
        const minRaw = r['Estoque Mínimo (Planilha)'];
        const maxRaw = r['Estoque Máximo (Planilha)'];
        const descontinuada = String(r['Descontinuada'] || '').trim().toUpperCase() === 'SIM';
        const temMinMaxValido = !descontinuada && minRaw !== '' && maxRaw !== '' && minRaw !== undefined && maxRaw !== undefined;
        if (chave) {
          minMaxPlanilha.set(chave, {
            min: temMinMaxValido ? parseNumeroBR(minRaw) : null,
            max: temMinMaxValido ? parseNumeroBR(maxRaw) : null,
            temMinMaxValido,
            descontinuada,
            mediaMensal: parseNumeroBR(r['Média Mensal']),
            desvioPadrao: parseNumeroBR(r['Desvio Padrão']),
            curva: r['Curva'] || '',
            leadTimeTotal: parseNumeroBR(r['Lead Time Total']),
            pontoPedido: r['Ponto de Pedido'] !== '' ? parseNumeroBR(r['Ponto de Pedido']) : null,
            pedidoSugerido: r['Pedido Sugerido'] !== '' ? parseNumeroBR(r['Pedido Sugerido']) : null,
            nivelAtendimento: parseNumeroBR(r['Nível Atendimento']),
            constanteZ: parseNumeroBR(r['Constante Z']),
            tempoReposicaoMeses: parseNumeroBR(r['Tempo Reposição (Meses)']),
            loteMinimo: parseNumeroBR(r['Lote Mínimo']),
            loteEconomico: parseNumeroBR(r['Lote Econômico']),
            vendaMediaDia3M: parseNumeroBR(r['Venda Média Dia (3M)']),
            estoqueSeguranca: r['Estoque de Segurança'] !== '' ? parseNumeroBR(r['Estoque de Segurança']) : null,
          });
        }
      });
    }

    // Só substitui os dados persistentes se a busca trouxe algo razoável.
    // Se veio vazia ou muito menor que a versão anterior (ex.: planilha
    // sendo editada bem na hora da consulta automática), mantém a última
    // versão boa em vez de fazer produtos "perderem" o match temporariamente.
    const ehRazoavel = minMaxPlanilha.size > 0 &&
      (minMaxPlanilhaPersistente.size === 0 || minMaxPlanilha.size >= minMaxPlanilhaPersistente.size * 0.5);
    if (ehRazoavel) {
      minMaxPlanilhaPersistente = minMaxPlanilha;
    }

    let qtdComOverride = 0;

    dadosCompletos = linhas.map(r => {
      const estoque = parseNumeroBR(r['Estoque Atual']);
      const custo = parseNumeroBR(r['Custo Unitário']);

      let minimo = parseNumeroBR(r['Estoque Mínimo']);
      let maximo = parseNumeroBR(r['Estoque Máximo']);
      let fonteMinMax = 'sysemp';

      const overridePlanilha = minMaxPlanilhaPersistente.get(normalizarProduto(r['Produto']));
      if (overridePlanilha && overridePlanilha.temMinMaxValido) {
        minimo = overridePlanilha.min;
        maximo = overridePlanilha.max;
        fonteMinMax = 'planilha';
        qtdComOverride++;
      }

      const situacao = estoque <= 0 ? 'RUPTURA' : (estoque < minimo ? 'BAIXO' : (estoque > maximo ? 'EXCESSO' : 'OK'));
      const valorEstoque = Math.max(0, estoque) * custo; // estoque negativo (venda além do saldo) não vira valor negativo
      const valorRepor = (situacao === 'RUPTURA' || situacao === 'BAIXO') ? Math.max(0, (minimo - estoque) * custo) : 0;
      return { produto: r['Produto'] || '', marca: r['Marca'] || '', grupo: r['Grupo'] || '(sem grupo)', codigoBarras: String(r['Código Barras'] || '').trim(), estoque, minimo, maximo, custo, situacao, valorEstoque, valorRepor, fonteMinMax, analise: overridePlanilha || null };
    });

    const totalAntesExclusao = dadosCompletos.length;
    dadosCompletos = dadosCompletos.filter(d => !MARCAS_EXCLUIDAS.includes(d.marca.trim().toUpperCase()));
    const qtdExcluida = totalAntesExclusao - dadosCompletos.length;

    document.getElementById('subtitle').textContent = fmtNum(dadosCompletos.length) + ' produtos monitorados em tempo real' +
      (qtdExcluida > 0 ? ' · ' + fmtNum(qtdExcluida) + ' ocultos (marcas excluídas)' : '') +
      (qtdComOverride > 0 ? ' · ' + fmtNum(qtdComOverride) + ' com mín/máx da planilha de análise' : '');
    document.getElementById('updated-label').textContent = 'atualizado às ' + new Date().toLocaleTimeString('pt-BR');
    renderizar();
  } catch (err) {
    document.getElementById('app').innerHTML =
      '<div class="error-box">Não consegui buscar os dados agora (' + err.message + ').<br><br>' +
      'Se este arquivo foi aberto direto do computador (duplo clique), publique-o num link real primeiro — ' +
      'navegadores bloqueiam esse tipo de busca em páginas locais. ' +
      'Confira também se a planilha está compartilhada como "qualquer pessoa com o link pode visualizar".</div>';
    document.getElementById('subtitle').textContent = 'falha ao carregar';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Atualizar agora';
  }
}

// Plugin custom (sem dependência externa) pra desenhar rótulos fora do
// anel do donut, com uma linha fina conectando cada fatia ao seu texto —
// Chart.js não tem isso nativo. Só desenha fatias com valor > 0 (rótulo de
// fatia vazia não ajuda ninguém) e pula fatias finas demais (< 4% do
// total) pra evitar textos colados/sobrepostos quando uma situação tem
// poucos itens.
// Plugin custom (sem dependência externa): desenha UMA seta com rótulo
// (nome + valor) saindo da fatia sob o mouse — só a fatia ativa, nunca
// todas ao mesmo tempo, o que elimina de vez o problema de colisão entre
// rótulos vizinhos e de texto sendo cortado na borda do canvas (que dava
// problema quando a gente tentava mostrar todos os rótulos sempre juntos).
// activeElements já vem pronto do Chart.js (é o hover nativo, o mesmo que
// dispara hoverOffset/tooltip) — só reaproveita.
const donutSetaHoverPlugin = {
  id: 'donutSetaHover',
  afterDraw(chart) {
    const ativos = chart.getActiveElements();
    if (!ativos || !ativos.length) return;
    const { datasetIndex, index } = ativos[0];
    const meta = chart.getDatasetMeta(datasetIndex);
    const arc = meta.data[index];
    if (!arc) return;
    const dataset = chart.data.datasets[datasetIndex];
    const valor = dataset.data[index];
    if (!valor) return;
    const cor = Array.isArray(dataset.backgroundColor) ? dataset.backgroundColor[index] : dataset.backgroundColor;
    const { ctx } = chart;
    // IMPORTANTE: usar arc.x/arc.y (centro real do donut, fixo) e não
    // arc.getCenterPoint() — esse último já embute o deslocamento radial
    // do hoverOffset (a fatia "pulando" pra fora no hover), então somar
    // o próprio raio em cima disso aplicava o offset em dobro e fazia a
    // linha nascer bem longe da fatia, solta no meio do card.
    const cx = arc.x, cy = arc.y;
    const angulo = (arc.startAngle + arc.endAngle) / 2;
    const rOut = arc.outerRadius;
    const laDireita = Math.cos(angulo) >= 0;
    // Linha nasce bem na borda externa do anel (onde a cor da fatia
    // termina) e sai lateralmente pra fora — não atravessa a fatia por
    // dentro (isso dava a impressão de "vir de dentro" do donut, mas o
    // pedido era sair da lateral/borda, não do centro).
    const p1x = cx + Math.cos(angulo) * (rOut + 2);
    const p1y = cy + Math.sin(angulo) * (rOut + 2);
    const p2x = cx + Math.cos(angulo) * (rOut + 40);
    const p2y = cy + Math.sin(angulo) * (rOut + 40);

    // Calcula a caixa do rótulo (com clamp de borda) ANTES de desenhar a
    // linha, pra o cotovelo horizontal da linha terminar exatamente onde a
    // caixa começa — antes o clamp só movia a caixa, deixando a linha
    // apontando pra um ponto vazio longe dela (era esse o motivo de a seta
    // "sumir" nos ângulos perto da borda do canvas: linha e caixa paravam
    // em lugares diferentes).
    const rotulo = chart.data.labels[index] + '  ' + valor.toLocaleString('pt-BR');
    ctx.font = "600 12px Inter, -apple-system, 'Segoe UI', sans-serif";
    const largura = ctx.measureText(rotulo).width;
    const padX = 7;
    const alturaCaixa = 22;
    const margemSegura = 4;
    let p3x = p2x + (laDireita ? 22 : -22);
    let textoX = p3x + (laDireita ? 6 : -6);
    let caixaX = laDireita ? textoX - padX : textoX - largura - padX;
    if (laDireita && caixaX + largura + padX * 2 > chart.width - margemSegura) {
      const excesso = (caixaX + largura + padX * 2) - (chart.width - margemSegura);
      caixaX -= excesso; textoX -= excesso; p3x -= excesso;
    } else if (!laDireita && caixaX < margemSegura) {
      const excesso = margemSegura - caixaX;
      caixaX += excesso; textoX += excesso; p3x += excesso;
    }
    const centroY = Math.max(alturaCaixa / 2 + 4, Math.min(chart.height - alturaCaixa / 2 - 4, p2y));

    ctx.save();
    ctx.strokeStyle = cor; ctx.lineWidth = 1.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(p1x, p1y); ctx.lineTo(p2x, centroY); ctx.lineTo(p3x, centroY); ctx.stroke();
    ctx.fillStyle = cor; ctx.beginPath(); ctx.arc(p1x, p1y, 2.5, 0, Math.PI * 2); ctx.fill();

    // 'middle' ancora o texto no meio vertical dele mesmo — bem mais fácil
    // de centralizar dentro da caixa do que calcular offset com 'bottom'
    // (era esse cálculo errado que deixava o texto abaixo da caixa antes).
    ctx.textBaseline = 'middle';
    ctx.textAlign = laDireita ? 'left' : 'right';
    // Placa de fundo atrás do texto pra garantir legibilidade em qualquer
    // ponto do card (evita texto claro sumindo contra fundo claro, ou
    // colidindo visualmente com o número central se a seta apontar perto
    // dele) — mede a largura real do texto pra caixa ficar justa.
    ctx.fillStyle = 'rgba(11,11,13,0.92)';
    ctx.beginPath();
    ctx.roundRect(caixaX, centroY - alturaCaixa / 2, largura + padX * 2, alturaCaixa, 6);
    ctx.fill();
    ctx.strokeStyle = cor; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = '#F0F0F0';
    ctx.fillText(rotulo, textoX, centroY);
    ctx.restore();

};

// ----------------------------------------------------------------------
// PAINEL DE DETALHE (dados de exemplo, até a Sysemp liberar o endpoint
// de histórico de compras/vendas — ver Especificacao_Historico_Compras_Vendas.docx)
// ----------------------------------------------------------------------
function hashTexto(txt) {
  let h = 0;
  for (let i = 0; i < txt.length; i++) { h = ((h << 5) - h + txt.charCodeAt(i)) | 0; }
  return Math.abs(h);
}

function gerarComprasExemplo(produto) {
  const seed = hashTexto(produto.produto + produto.marca);
  const rnd = (min, max, offset) => min + ((seed + offset * 977) % 1000) / 1000 * (max - min);
  const fornecedores = ['Distribuidora Central', produto.marca + ' Indústria', 'Comercial Atacado SP', 'Fornecedor Direto'];

  const compras = [];
  let diasAcumulados = Math.floor(rnd(3, 40, 0));
  for (let i = 0; i < 5; i++) {
    const data = new Date(Date.now() - diasAcumulados * 86400000);
    compras.push({
      data: data.toLocaleDateString('pt-BR'),
      numeroNf: 100000 + ((seed + i * 3331) % 899999),
      fornecedor: fornecedores[(seed + i) % fornecedores.length],
      quantidade: Math.max(1, Math.round(rnd(produto.minimo * 0.6, produto.minimo * 2.2, i + 1))),
    });
    diasAcumulados += Math.floor(rnd(15, 60, i + 10));
  }
  return compras;
}

// ----------------------------------------------------------------------
// Busca compras e vendas REAIS na Sysemp (via ponte do Apps Script),
// um produto por vez, sob demanda — só quando o usuário clica no item.
// ----------------------------------------------------------------------
async function buscarComprasVendasReais(codigoBarras) {
  const resultado = { compras: null, vendas: null, erro: null };
  if (!codigoBarras) { resultado.erro = 'Produto sem código de barras.'; return resultado; }

  // Cadeia navegador -> Apps Script -> Sysemp pode travar sem avisar —
  // limita a espera a 15s por chamada, pra sempre cair no modo de exemplo
  // em vez de ficar preso na tela de carregamento pra sempre.
  // Aplicativos da Web do Apps Script têm uma sobrecarga própria de
  // infraestrutura (redirecionamentos internos do Google) que pode levar
  // vários segundos, mesmo quando o código em si roda rápido — por isso
  // a margem é generosa (30s), não é sinal de código lento.
  const TIMEOUT_MS = 30000;
  function fetchComTimeout(url) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), TIMEOUT_MS);
    return fetch(url, { signal: controller.signal }).finally(() => clearTimeout(timer));
  }

  try {
    const [respCompras, respVendas] = await Promise.all([
      fetchComTimeout(WEBAPP_URL + '?codBarra=' + encodeURIComponent(codigoBarras) + '&tipo=compras'),
      fetchComTimeout(WEBAPP_URL + '?codBarra=' + encodeURIComponent(codigoBarras) + '&tipo=vendas'),
    ]);
    const jsonCompras = await respCompras.json();
    const jsonVendas = await respVendas.json();

    if (jsonCompras.ok && jsonCompras.dados && jsonCompras.dados.retorno && jsonCompras.dados.retorno[0]) {
      const itemCompras = jsonCompras.dados.retorno[0];
      resultado.compras = (itemCompras.ultimas_compras || []).map(c => ({
        data: c['Data da Compra'] ? new Date(c['Data da Compra'] + 'T00:00:00').toLocaleDateString('pt-BR') : '—',
        numeroNf: c['Número NF'] || '—',
        fornecedor: c['Fornecedor'] || '—',
        quantidade: parseFloat(c['Quantidade Comprada']) || 0,
        custo: parseFloat(c['Custo Unitário']) || 0,
      }));
    }

    if (jsonVendas.ok && jsonVendas.dados && jsonVendas.dados.retorno && jsonVendas.dados.retorno[0]) {
      const itemVendas = jsonVendas.dados.retorno[0];
      resultado.vendas = {
        mediaMensal12M: parseFloat(itemVendas['Média Mensal 12 Meses']) || 0,
        totalVendido12M: parseFloat(itemVendas['Total vendido 12 Meses']) || 0,
        dataUltimaVenda: itemVendas['Data Última Venda'] ? new Date(itemVendas['Data Última Venda'] + 'T00:00:00').toLocaleDateString('pt-BR') : '—',
        qtdUltimaVenda: parseFloat(itemVendas['Quantidade Última Venda']) || 0,
      };
    }

    if (!resultado.compras && !resultado.vendas) {
      resultado.erro = 'Sysemp não retornou dados para este produto.';
    }
  } catch (err) {
    resultado.erro = err.name === 'AbortError'
      ? 'A Sysemp demorou demais para responder (mais de 30s).'
      : 'Falha ao buscar dados reais (' + err.message + ').';
  }

  return resultado;
}

// Calcula o Pedido Sugerido usando o estoque e pedidos em aberto AO VIVO
// (não o valor estático que veio junto com a planilha de análise) — usada
// tanto no painel de detalhe quanto na geração do arquivo pro Sysemp, pra
// nunca mostrar números diferentes em lugares diferentes do painel.
// Ponto de Pedido/Estoque de Segurança/Lote continuam vindo da planilha
// (não dependem do estoque do momento, só a Necessidade depende).
// Extrai o múltiplo de compra do NOME do produto — a Sysemp/fornecedor
// costuma colocar entre parênteses no final, ex.: "...BRASFORT (6)" =
// só pode comprar em múltiplos de 6. É o dado mais confiável que existe
// (vem direto da embalagem do fornecedor), então essa regra vale sempre,
// mesmo quando a planilha Excel tiver um Lote Mínimo diferente cadastrado.
function extrairLoteDoNome(nomeProduto) {
  // Procura "(N)" em QUALQUER lugar do nome — a Sysemp às vezes coloca no
  // final ("...BRASFORT (6)"), às vezes no meio ("...LATÃO (20) REF:...
  // - TAF"). Pega a primeira ocorrência de um número puro entre parênteses.
  const match = String(nomeProduto || '').match(/\((\d+)\)/);
  if (!match) return null;
  const lote = parseInt(match[1], 10);
  return lote > 0 ? lote : null;
}

// Arredonda uma quantidade sugerida PRA CIMA, pro múltiplo do lote do
// produto (se o nome tiver um). Não mexe em quantidade 0 (nada a comprar
// continua sendo nada a comprar).
function ajustarParaLoteDoNome(quantidade, produto) {
  if (!quantidade || quantidade <= 0) return quantidade;
  const lote = extrairLoteDoNome(produto.produto);
  if (!lote) return quantidade;
  return Math.ceil(quantidade / lote) * lote;
}

function calcularPedidoSugeridoAoVivo(produto) {
  const an = produto.analise;
  if (!an || an.descontinuada || an.pontoPedido == null || an.estoqueSeguranca == null) return null;
  const emAbertoAoVivo = pedidosEmAberto.get(normalizarProduto(produto.produto)) || 0;
  const pedidoCalculado = an.pontoPedido - an.estoqueSeguranca;
  const estoqueConsolidadoAoVivo = produto.estoque + emAbertoAoVivo;
  const necessidadeAoVivo = Math.max(0, an.pontoPedido - estoqueConsolidadoAoVivo + pedidoCalculado);
  if (necessidadeAoVivo === 0) return 0;
  const adicionaisAoVivo = necessidadeAoVivo < an.loteMinimo ? 0 : Math.ceil((necessidadeAoVivo - an.loteMinimo) / an.loteEconomico) * an.loteEconomico;
  return ajustarParaLoteDoNome(an.loteMinimo + adicionaisAoVivo, produto);
}

// ----------------------------------------------------------------------
// Exportação no formato de importação de pedido do Sysemp
// (tela "Pedido Importar Texto": separador ; , decimal com vírgula,
// sem cabeçalho, layout "Codigo, Quantidade, Preço (Custo)", usando
// Código de Barras).
// ----------------------------------------------------------------------
// Sugestão de compra pra quando NÃO tem match na planilha de análise, mas
// temos venda real (ao vivo) da Sysemp — Média × Lead Time da marca menos
// o estoque atual. Mesma função usada no modal e na geração do pedido.
function calcularSugestaoSemPlanilha(produto, mediaMensal12M) {
  const marcaNormalizada = normalizarFornecedor(produto.marca);
  const leadTimeMarca = LEAD_TIME_POR_MARCA[marcaNormalizada];
  const temLeadTime = leadTimeMarca !== undefined && leadTimeMarca !== null;
  const tempoReposicaoMeses = temLeadTime ? leadTimeMarca / DIAS_POR_MES_SYSEMP : 1;
  const emAberto = pedidosEmAberto.get(normalizarProduto(produto.produto)) || 0;
  const bruto = Math.max(0, Math.round(mediaMensal12M * tempoReposicaoMeses - produto.estoque - emAberto));
  return ajustarParaLoteDoNome(bruto, produto);
}

async function gerarPedidoSysemp(marca, itens) {
  const btn = document.getElementById('gerar-pedido-btn');
  const textoOriginalBtn = btn ? btn.textContent : null;
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Calculando...'; }

  const linhasCalculadas = await Promise.all(itens.map(async d => {
    let qtd;
    if (d.analise && !d.analise.descontinuada && d.analise.pontoPedido != null) {
      // calcularPedidoSugeridoAoVivo já desconta os pedidos em aberto
      // internamente — mesma função usada no painel de detalhe, garante
      // que o número aqui é sempre igual ao que aparece lá.
      qtd = calcularPedidoSugeridoAoVivo(d) || 0;
    } else {
      // Sem match na planilha — busca a venda real (ao vivo) pra usar a
      // MESMA fórmula do modal (média × lead time da marca).
      const dadosVendas = await buscarComprasVendasReais(d.codigoBarras);
      if (dadosVendas.vendas) {
        qtd = calcularSugestaoSemPlanilha(d, dadosVendas.vendas.mediaMensal12M);
      } else {
        // Sem histórico de venda nenhum (nem Excel, nem Sysemp) — sem
        // necessidade de repor, não sugere nada (mesma regra do modal).
        qtd = 0;
      }
    }
    const custoFormatado = (d.custo || 0).toFixed(2).replace('.', ',');
    return { codigo: d.codigoBarras, qtd, custoFormatado };
  }));

  if (btn && textoOriginalBtn !== null) { btn.disabled = false; btn.textContent = textoOriginalBtn; }

  const linhas = linhasCalculadas.filter(l => l.codigo && l.qtd > 0);

  if (linhas.length === 0) {
    alert('Nenhum item de ' + marca + ' tem quantidade sugerida maior que zero — nada para exportar.');
    return;
  }

  const conteudo = linhas.map(l => l.codigo + ';' + l.qtd + ';' + l.custoFormatado).join('\n');
  const blob = new Blob(['\uFEFF' + conteudo], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const dataHoje = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = 'pedido_' + marca.replace(/[^a-zA-Z0-9]+/g, '_') + '_' + dataHoje + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ----------------------------------------------------------------------
// Importação de Pedidos em Aberto (CSV exportado do Sysemp) — o
// arquivo vem com um cabeçalho de 2 linhas meio bagunçado (seção +
// nomes de coluna), então procuramos a linha real de cabeçalho em vez
// de assumir que é sempre a primeira.
// ----------------------------------------------------------------------
// Divide um texto de largura fixa (colunas alinhadas com espaços, como
// o TXT exportado pelo Sysemp) em linhas de campos — corta em qualquer
// sequência de 2+ espaços, preservando espaços simples dentro do texto
// de cada campo (ex.: nomes de produto com espaço entre palavras).
function parseLarguraFixa(texto) {
  return texto.split(/\r\n|\r|\n/)
    .map(l => l.trim())
    .filter(l => l !== '')
    .map(l => l.split(/\s{2,}/).map(c => c.trim()));
}

function acharCabecalho(linhas) {
  for (let i = 0; i < Math.min(linhas.length, 5); i++) {
    const linha = linhas[i].map(c => String(c).trim().toLowerCase());
    const idxProduto = linha.findIndex(c => c === 'produto');
    const idxQtde = linha.findIndex(c => c === 'qtde' || c === 'quantidade');
    if (idxProduto !== -1 && idxQtde !== -1) {
      return { linhaHeaderIdx: i, colProduto: idxProduto, colQtde: idxQtde };
    }
  }
  return null;
}

function processarArquivoPedidosAberto(texto) {
  // Tenta primeiro como CSV (vírgula/ponto e vírgula); se não achar as
  // colunas certas, tenta como texto de largura fixa (colunas alinhadas
  // com espaços — formato do botão "TXT" do Sysemp).
  let linhas = parseCSV_bruto(texto);
  let cabecalho = acharCabecalho(linhas);
  if (!cabecalho) {
    linhas = parseLarguraFixa(texto);
    cabecalho = acharCabecalho(linhas);
  }

  if (!cabecalho) {
    return { ok: false, erro: 'Não encontrei as colunas "Produto" e "Qtde" nas primeiras linhas do arquivo.' };
  }
  const { linhaHeaderIdx, colProduto, colQtde } = cabecalho;

  let importados = 0;
  for (let i = linhaHeaderIdx + 1; i < linhas.length; i++) {
    const linha = linhas[i];
    const produto = linha[colProduto];
    // ignora a linha de rodapé "Itens: N" e afins
    if (!produto || /^itens\s*:/i.test(String(produto).trim())) continue;
    const qtde = parseNumeroBR(linha[colQtde]);
    if (produto && String(produto).trim() && qtde > 0) {
      const chave = normalizarProduto(produto);
      pedidosEmAberto.set(chave, (pedidosEmAberto.get(chave) || 0) + qtde);
      importados++;
    }
  }

  return { ok: true, importados };
}

// Parser CSV que devolve linhas cruas (array de arrays). Detecta
// sozinho se o separador é vírgula ou ponto e vírgula — o Excel em
// português normalmente usa ; mesmo quando o menu diz "separado por
// vírgulas", porque a vírgula já é o separador decimal no Brasil.
function parseCSV_bruto(texto) {
  const primeiraLinha = texto.split(/\r?\n/, 1)[0] || '';
  const qtdVirgulas = (primeiraLinha.match(/,/g) || []).length;
  const qtdPontoVirgula = (primeiraLinha.match(/;/g) || []).length;
  const separador = qtdPontoVirgula > qtdVirgulas ? ';' : ',';

  const linhas = [];
  let campo = '', linhaAtual = [], dentroAspas = false;
  for (let i = 0; i < texto.length; i++) {
    const c = texto[i], prox = texto[i + 1];
    if (dentroAspas) {
      if (c === '"' && prox === '"') { campo += '"'; i++; }
      else if (c === '"') { dentroAspas = false; }
      else { campo += c; }
    } else {
      if (c === '"') { dentroAspas = true; }
      else if (c === separador) { linhaAtual.push(campo); campo = ''; }
      else if (c === '\r') { /* ignora */ }
      else if (c === '\n') { linhaAtual.push(campo); campo = ''; linhas.push(linhaAtual); linhaAtual = []; }
      else { campo += c; }
    }
  }
  if (campo !== '' || linhaAtual.length > 0) { linhaAtual.push(campo); linhas.push(linhaAtual); }
  return linhas.filter(l => l.some(v => v !== ''));
}

// Remove o texto entre parênteses (nome do distribuidor/observação) pra
// comparar só o nome da marca — ex.: "AGUIA FORCE (PYRAMID)" -> "AGUIA FORCE"
function normalizarFornecedor(texto) {
  return String(texto || '').split('(')[0].trim().toUpperCase().replace(/\s+/g, ' ');
}

function diaSemanaAtual() {
  const dias = ['DOM', 'SEG', 'TER', 'QUA', 'QUI', 'SEX', 'SAB'];
  return dias[new Date().getDay()];
}

// Semana do mês: dias 1-7 = semana 1, 8-14 = semana 2, 15-21 = semana 3,
// 22 em diante = semana 4 (regra simples por faixa de data).
function semanaDoMesAtual() {
  return Math.min(4, Math.ceil(new Date().getDate() / 7));
}

function calcularFornecedoresPorDia(diaAlvo) {
  const semanaHoje = semanaDoMesAtual();
  return ROTINA_COMPRAS.filter(r => {
    if (r.d !== diaAlvo) return false;
    if (r.t === 'SEMANAL') return true;
    if (r.t === 'QUINZENAL') {
      if (r.s === 'S1+S3') return semanaHoje === 1 || semanaHoje === 3;
      if (r.s === 'S2+S4') return semanaHoje === 2 || semanaHoje === 4;
      return false;
    }
    if (r.t === 'MENSAL') return r.s === semanaHoje;
    return false;
  });
}

function renderizarAbaVendas() {
  // Consumo único da flag: só anima as tabelas se a renderização foi
  // disparada por uma troca de filtro real (grupo ou marca), mesma
  // convenção do donut/gráficos.
  const animarTabelasVendasAgora = animarTabelasVendasNoProximoRender;
  animarTabelasVendasNoProximoRender = false;
  // Só considera produtos com Média Mensal disponível (batem com a
  // planilha de análise) — os ~10% sem match ficam de fora, mesma
  // limitação de sempre (aceita, conforme combinado).
  const todosGruposVenda = [...new Set(dadosCompletos.map(d => d.grupo))].sort((a, b) => a.localeCompare(b, 'pt-BR'));
  const comVenda = dadosCompletos.filter(d => d.analise && !d.analise.descontinuada && d.analise.mediaMensal > 0 && (!filtroGrupoVendas || d.grupo === filtroGrupoVendas));
  const maisVendidos = [...comVenda].sort((a, b) => b.analise.mediaMensal - a.analise.mediaMensal).slice(0, 15);
  const menosVendidos = [...comVenda].sort((a, b) => a.analise.mediaMensal - b.analise.mediaMensal).slice(0, 15);

  const porMarca = {};
  comVenda.forEach(d => {
    const chave = normalizarFornecedor(d.marca);
    if (!porMarca[chave]) porMarca[chave] = { marca: d.marca, totalMedia: 0, qtdProdutos: 0 };
    porMarca[chave].totalMedia += d.analise.mediaMensal;
    porMarca[chave].qtdProdutos++;
  });
  const marcasArray = Object.values(porMarca);
  const marcasMaisVendidas = [...marcasArray].sort((a, b) => b.totalMedia - a.totalMedia).slice(0, 10);
  const marcasMenosVendidas = [...marcasArray].sort((a, b) => a.totalMedia - b.totalMedia).slice(0, 10);

  // ---- Qtd. vendida por grupo/linha de produto (real) ----
  const porGrupoVenda = {};
  comVenda.forEach(d => { porGrupoVenda[d.grupo] = (porGrupoVenda[d.grupo] || 0) + d.analise.mediaMensal; });
  const gruposVendaOrdenados = Object.entries(porGrupoVenda).sort((a, b) => b[1] - a[1]).slice(0, 10);

  // ---- Visão geral (cartões do topo) ----
  // Faturamento é uma ESTIMATIVA real (média mensal vendida × custo unitário
  // de cada produto) — os demais números dessa seção (meta, vendedor,
  // ticket médio) são fictícios, ver aviso na tela e comentário na
  // declaração de VENDEDORES_FICTICIOS lá em cima.
  const faturamentoEstimado = comVenda.reduce((s, d) => s + d.analise.mediaMensal * d.custo, 0);
  const metaFicticia = VENDEDORES_FICTICIOS.reduce((s, v) => s + v.meta, 0);

          { type: 'line', label: 'Meta', data: metaPorTrimestre, borderColor: '#e11d48', borderDash: [6, 4], borderWidth: 2, pointRadius: 0, tension: 0 },
        ],

      options: {
        responsive: true, maintainAspectRatio: false,
        animation: false,
        plugins: {
          legend: { position: 'top', align: 'end', labels: { color: '#4b5563', boxWidth: 10, font: { size: 10.5 }, usePointStyle: true } },
          tooltip: Object.assign({}, CHART_TOOLTIP_STYLE_CLARO, { callbacks: { label: ctx => ctx.dataset.label + ': ' + fmtMoedaCompacta(ctx.parsed.y) } }),
        },
        scales: {
          x: { ticks: { color: '#6b7280', font: { size: 11 } }, grid: { display: false } },
          y: { ticks: { color: '#6b7280', font: { size: 10 }, callback: v => fmtMoedaCompacta(v) }, grid: { color: '#f1f5f9' } },
        },
      },
    });
  }

  // ---- ticket médio por ano (fictício) ----
  if (vendasTicketAnoChartInstance) vendasTicketAnoChartInstance.destroy();
  const canvasTicketAno = document.getElementById('vendas-ticket-ano-chart');
  if (canvasTicketAno) {
    const anosFicticios = ['2024', '2025', '2026'];
    const ticketsPorAno = [ticketMedioFicticio * 0.94, ticketMedioFicticio * 0.98, ticketMedioFicticio];
    vendasTicketAnoChartInstance = new Chart(canvasTicketAno, {
      type: 'bar',
      data: { labels: anosFicticios, datasets: [{ data: ticketsPorAno, backgroundColor: '#059669', borderRadius: 6, maxBarThickness: 60 }] },
      options: {
        responsive: true, maintainAspectRatio: false,
        animation: false,
        plugins: {
          legend: { display: false },
          tooltip: Object.assign({}, CHART_TOOLTIP_STYLE_CLARO, { callbacks: { label: ctx => fmtMoeda(ctx.parsed.y) } }),
        },
        scales: {
          x: { ticks: { color: '#6b7280', font: { size: 11 } }, grid: { display: false } },
          y: { ticks: { color: '#6b7280', font: { size: 10 }, callback: v => fmtMoedaCompacta(v) }, grid: { color: '#f1f5f9' } },
        },
      },
    });
  }

  const selectGrupoVendas = document.getElementById('select-grupo-vendas');
  if (selectGrupoVendas) selectGrupoVendas.addEventListener('change', e => { filtroGrupoVendas = e.target.value; animarTabelasVendasNoProximoRender = true; renderizar(); });

  const abaEstoqueEl2 = document.getElementById('aba-estoque');
  if (abaEstoqueEl2) abaEstoqueEl2.addEventListener('click', () => { abaSelecionada = 'estoque'; fecharNavSidebar(); renderizar(); });
  const abaVendasEl2 = document.getElementById('aba-vendas');

  document.querySelectorAll('tbody tr.clickable[data-idx-relatorio-marca]').forEach(tr => tr.addEventListener('click', () => {

  const baixarCsvMarcaBtn = document.getElementById('baixar-csv-marca-vendas');
  if (baixarCsvMarcaBtn) baixarCsvMarcaBtn.addEventListener('click', () => {
    const linhas = itensRelatorioMarca.map(d => [
      d.produto, d.marca, d.analise.curva || '',
      d.analise.mediaMensal.toFixed(1).replace('.', ','),
      d.estoque,
      d.valorEstoque.toFixed(2).replace('.', ','),
    ]);
    const nomeArquivo = 'itens_mais_vendidos_' + normalizarFornecedor(marcaRelatorioVendas).replace(/\s+/g, '_') + '.csv';
    baixarCSV(nomeArquivo,
      ['Produto', 'Marca', 'Curva ABC', 'Média mensal (un)', 'Estoque atual', 'Valor em estoque (R$)'],
      linhas);

  document.querySelectorAll('tbody tr.clickable[data-idx-mais]').forEach(tr => tr.addEventListener('click', () => {
    const item = maisVendidos[parseInt(tr.dataset.idxMais, 10)];
    if (item) abrirDetalheProduto(item);

  document.querySelectorAll('tbody tr.clickable[data-idx-menos]').forEach(tr => tr.addEventListener('click', () => {
    const item = menosVendidos[parseInt(tr.dataset.idxMenos, 10)];
    if (item) abrirDetalheProduto(item);

  document.querySelectorAll('tbody tr.clickable[data-idx-semgiro]').forEach(tr => tr.addEventListener('click', () => {
    const item = semGiro[parseInt(tr.dataset.idxSemgiro, 10)];

  tornarClicaveisAcessiveis(document.getElementById('app'));
