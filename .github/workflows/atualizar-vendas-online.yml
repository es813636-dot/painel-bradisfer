name: Atualizar Vendas Online (Marketplace)

on:
  schedule:
    # Religado em 03/09/2026 depois de resolver os 2 bugs que causaram a
    # duplicação de 02/09 (ver histórico do arquivo e CONTEXTO.md):
    #   1. A API listarVendasPorVendedor não respeitava datainicial/
    #      datafinal numa chamada da empresa 4 -- reportado e corrigido
    #      pela Sysemp no mesmo dia. Reconfirmado ao vivo (empresa 3 e 4,
    #      janela de 1-2 dias, 0 linha fora do período) antes de religar.
    #   2. O ChaveDedup mudou de formato (6 -> 8 campos) entre a carga
    #      inicial e a 1ª rodada incremental, quebrando o dedup -- corrigido
    #      com limpar-duplicatas-vendas-online.js (rodado 1x, ver commit),
    #      que recalcula a chave de verdade e migra tudo pro formato novo.
    #      122.194 linhas limpas restantes, 0 duplicata, 0 divergência.
    #   3. Confirmado com um disparo manual de controle: incremento real de
    #      1.127 linhas num dia, dentro do esperado (não mais dezenas de
    #      milhares).
    - cron: '*/5 8-23,0-2 * * *'
  workflow_dispatch: {}

jobs:
  atualizar-vendas-online:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: automacao-vendas
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install

      - run: node atualizar-vendas-online.js
        env:
          SYSEMP_TOKEN: ${{ secrets.SYSEMP_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
