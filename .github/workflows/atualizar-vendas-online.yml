name: Atualizar Vendas Online (Marketplace)

on:
  # `schedule` DESLIGADO DE PROPÓSITO em 02/09/2026 -- a run #4 (incremental,
  # janela de só 1-2 dias) gravou ~61 mil linhas novas de uma vez, muito
  # mais do que uma janela curta deveria trazer. Suspeita: o ChaveDedup das
  # linhas gravadas na carga inicial (run #2) usa o formato ANTIGO de 6
  # campos, mas o código já estava no formato NOVO de 8 campos (commit
  # 2361029) quando a incremental rodou -- toda chave nova ficou diferente
  # de toda chave antiga, então o dedup não reconheceu nada como repetido e
  # reprocessou tudo que voltou como "novo". Ainda não confirmado se o
  # endpoint também não respeita a janela de data pedida (segunda causa
  # possível, agravando o problema). Religar só depois de:
  #   1. Confirmar/descartar se a API ignora datainicial/datafinal;
  #   2. Migrar o ChaveDedup de todas as linhas já gravadas pro formato
  #      novo (ou voltar o código pro formato antigo, o que for decidido);
  #   3. Rodar 1x via workflow_dispatch e conferir que o incremento real
  #      bate com o volume esperado antes de religar o cron.
  # schedule:
  #   - cron: '*/5 8-23,0-2 * * *'
  workflow_dispatch: {}

jobs:
  atualizar-vendas-online:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: automacao-vendas
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install

      - run: node atualizar-vendas-online.js
        env:
          SYSEMP_TOKEN: ${{ secrets.SYSEMP_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
