name: BigQuery - carga incremental

on:
  schedule:
    # Hoje e ontem a cada 5 minutos durante o horário operacional.
    - cron: '*/5 8-23,0-2 * * *'
    # Reconciliação móvel de sete dias às 04:30 em São Paulo.
    - cron: '30 7 * * *'
  workflow_dispatch:
    inputs:
      origem:
        description: Origem (fixture não usa credenciais)
        type: choice
        default: fixture
        options: [fixture, api]
      modo:
        description: Simular, auditar com Sheets ou publicar direto da API
        type: choice
        default: simulacao
        options: [simulacao, publicar, publicar_api]
      data_inicio:
        description: Data inicial AAAA-MM-DD (vazio usa últimos 7 dias)
        type: string
      data_fim:
        description: Data final AAAA-MM-DD (máximo 31 dias por lote)
        type: string
      estoque:
        description: Incluir snapshot atual de estoque
        type: boolean
        default: false
      conciliar_sheets:
        description: Comparar abas fiscais do Sheets (obrigatório para publicar)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: bigquery-paralelo
  cancel-in-progress: false

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: bigquery
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: bigquery/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: node --test ../automacao-vendas/atualizar-vendas-notas-itens.test.js
      - run: npm run simulate
      - name: Validar seleção
        env:
          SOURCE: ${{ github.event_name == 'schedule' && 'api' || inputs.origem }}
          MODE: ${{ github.event_name == 'schedule' && 'publicar_api' || inputs.modo }}
          SHEETS: ${{ inputs.conciliar_sheets }}
          API_ONLY: ${{ github.event_name == 'schedule' || inputs.modo == 'publicar_api' }}
        run: |
          if [[ ( "$MODE" == publicar || "$MODE" == publicar_api ) && "$SOURCE" != api ]]; then
            echo 'Publicação exige origem API.'
            exit 1
          fi
          if [[ "$MODE" == publicar && "$SHEETS" != true && "$API_ONLY" != true ]]; then
            echo 'Publicação manual exige conciliação Sheets.'
            exit 1
          fi

  carga:
    needs: validar
    if: github.event_name == 'schedule' || inputs.origem == 'api'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: bigquery-paralelo
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: bigquery
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: bigquery/package-lock.json
      - run: npm ci --ignore-scripts
      - uses: google-github-actions/auth@v3
        if: github.event_name == 'schedule' || inputs.modo == 'publicar' || inputs.modo == 'publicar_api' || inputs.conciliar_sheets
        with:
          workload_identity_provider: ${{ vars.BQ_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.BQ_WRITER_SERVICE_ACCOUNT }}
      - name: Executar carga paralela
        env:
          SYSEMP_TOKEN: ${{ secrets.SYSEMP_TOKEN }}
          BQ_PROJECT_ID: ${{ vars.BQ_PROJECT_ID }}
          BQ_LOCATION: ${{ vars.BQ_LOCATION }}
          BQ_RAW_DATASET: ${{ vars.BQ_RAW_DATASET }}
          BQ_COMERCIAL_DATASET: ${{ vars.BQ_COMERCIAL_DATASET }}
          BQ_STAGING_DATASET: ${{ vars.BQ_STAGING_DATASET }}
          BQ_MAX_BYTES: ${{ vars.BQ_MAX_BYTES || '1000000000' }}
          BQ_SHEETS_ID: ${{ vars.BQ_SHEETS_ID }}
          START: ${{ inputs.data_inicio }}
          END: ${{ inputs.data_fim }}
          MODE: ${{ github.event_name == 'schedule' && 'publicar_api' || inputs.modo }}
          STOCK: ${{ inputs.estoque }}
          SHEETS: ${{ inputs.conciliar_sheets }}
          API_ONLY: ${{ github.event_name == 'schedule' || inputs.modo == 'publicar_api' }}
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: |
          args=()
          if [[ "$EVENT_NAME" == schedule && "$SCHEDULE_CRON" != '30 7 * * *' ]]; then
            END="$(TZ=America/Sao_Paulo date +%F)"
            START="$(TZ=America/Sao_Paulo date -d 'yesterday' +%F)"
          fi
          [[ -z "$START" ]] || args+=(--start "$START")
          [[ -z "$END" ]] || args+=(--end "$END")
          [[ "$MODE" != publicar && "$MODE" != publicar_api ]] || args+=(--write)
          [[ "$STOCK" != true ]] || args+=(--stock)
          [[ "$SHEETS" != true ]] || args+=(--sheets)
          [[ "$API_ONLY" != true ]] || args+=(--api-only)
          node run.js "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bigquery-conciliacao-${{ github.run_id }}
          path: bigquery/output/*.json
          retention-days: 14
          if-no-files-found: ignore
