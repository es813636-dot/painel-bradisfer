name: Atualizar Vendas por Notas e Itens

on:
  schedule:
    - cron: '*/15 8-23,0-2 * * *'
  workflow_dispatch:
    inputs:
      modo:
        description: Tipo de carga
        required: true
        default: incremental
        type: choice
        options:
          - incremental
          - historico
      data_inicio:
        description: Data inicial opcional (AAAA-MM-DD)
        required: false
        type: string
      data_fim:
        description: Data final opcional (AAAA-MM-DD)
        required: false
        type: string
      incluir_b2b:
        description: Incluir vendas B2B
        required: true
        default: '1'
        type: choice
        options:
          - '0'
          - '1'
      incluir_b2b_itens:
        description: Gravar também o detalhe B2B por item (normalmente desativado)
        required: true
        default: '0'
        type: choice
        options:
          - '0'
          - '1'
      incluir_online:
        description: Incluir vendas online
        required: true
        default: '1'
        type: choice
        options:
          - '0'
          - '1'
      so_simular:
        description: Apenas consultar, sem alterar a planilha
        required: true
        default: '0'
        type: choice
        options:
          - '0'
          - '1'

concurrency:
  group: atualizar-vendas-notas-itens
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: automacao-vendas
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install

      - name: Validar transformação fiscal
        run: node --test atualizar-vendas-notas-itens.test.js

      - name: Atualizar notas, itens e conciliação
        run: node atualizar-vendas-notas-itens.js
        env:
          SYSEMP_TOKEN: ${{ secrets.SYSEMP_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          MODO_CARGA: ${{ inputs.modo || 'incremental' }}
          DATA_INICIO: ${{ inputs.data_inicio }}
          DATA_FIM: ${{ inputs.data_fim }}
          JANELA_DIAS: '7'
          INCLUIR_B2B: ${{ github.event_name == 'workflow_dispatch' && inputs.incluir_b2b || '1' }}
          INCLUIR_B2B_ITENS: ${{ github.event_name == 'workflow_dispatch' && inputs.incluir_b2b_itens || '0' }}
          INCLUIR_ONLINE: ${{ github.event_name == 'workflow_dispatch' && inputs.incluir_online || '1' }}
          SO_SIMULAR: ${{ github.event_name == 'workflow_dispatch' && inputs.so_simular || '0' }}
