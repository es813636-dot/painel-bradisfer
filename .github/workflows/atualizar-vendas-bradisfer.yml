name: Atualizar Vendas Bradisfer (B2B)

on:
  schedule:
    # Religado em 03/09/2026 depois de confirmar a carga histórica
    # (15.837 linhas, batendo exatamente com o teste ao vivo feito antes
    # de implementar) e da chave de dedup reforçada com id_pedido testada
    # isolada (2 marcas do mesmo pedido geram chaves diferentes). Pulado
    # o teste extra de 1 incremento manual de controle a pedido do
    # usuário, confiando na lógica já validada e no padrão que já
    # funcionou pro VendasOnline. Mesma janela horária das outras
    # automações; piso real do GitHub Actions é 5 min.
    - cron: '*/5 8-23,0-2 * * *'
  workflow_dispatch: {}

jobs:
  atualizar-vendas-bradisfer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: automacao-vendas
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install

      - run: node atualizar-vendas-bradisfer.js
        env:
          SYSEMP_TOKEN: ${{ secrets.SYSEMP_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
