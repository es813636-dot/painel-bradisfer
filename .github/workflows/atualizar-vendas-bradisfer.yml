name: Atualizar Vendas Bradisfer (B2B)

on:
  # Mantido apenas para recuperação manual. O painel passou a usar o resumo
  # conciliado da API fiscal em VendasB2B_Resumo.
  workflow_dispatch: {}

jobs:
  atualizar-vendas-bradisfer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: automacao-vendas
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install

      - run: node --test atualizar-vendas-bradisfer.test.js

      - run: node atualizar-vendas-bradisfer.js
        env:
          SYSEMP_TOKEN: ${{ secrets.SYSEMP_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
